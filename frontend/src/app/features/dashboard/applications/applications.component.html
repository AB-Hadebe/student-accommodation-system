<main class="main-content">
  <div class="page-container">
    <div class="page-header">
      <h2>My Applications</h2>
      <button mat-flat-button color="primary" routerLink="/applications/new">
        <mat-icon>add</mat-icon>
        New Application
      </button>
    </div>

    <mat-card class="applications-card">
      <mat-card-content>
        <div class="table-container">
          <table mat-table [dataSource]="dataSource" class="mat-elevation-z1" aria-label="Applications table">

            <!-- ID Column -->
            <ng-container matColumnDef="applicationId">
              <th mat-header-cell *matHeaderCellDef> Application ID </th>
              <td mat-cell *matCellDef="let app"> #{{app.id}} </td>
            </ng-container>

            <!-- Year Column -->
            <ng-container matColumnDef="year">
              <th mat-header-cell *matHeaderCellDef> Year </th>
              <td mat-cell *matCellDef="let app"> {{app.year}} </td>
            </ng-container>

            <!-- Status Column -->
            <ng-container matColumnDef="status">
              <th mat-header-cell *matHeaderCellDef> Status </th>
              <td mat-cell *matCellDef="let app"> <mat-chip [ngClass]="getStatusClass(app.status)">{{app.status}}</mat-chip> </td>
            </ng-container>

            <!-- Submitted Date Column -->
            <ng-container matColumnDef="submittedDate">
              <th mat-header-cell *matHeaderCellDef> Submitted Date </th>
              <td mat-cell *matCellDef="let app"> {{app.submittedDate | date}} </td>
            </ng-container>

            <!-- Type Column -->
            <ng-container matColumnDef="type">
              <th mat-header-cell *matHeaderCellDef> Type </th>
              <td mat-cell *matCellDef="let app"> {{app.type}} </td>
            </ng-container>

            <!-- Duration Column -->
            <ng-container matColumnDef="duration">
              <th mat-header-cell *matHeaderCellDef> Duration </th>
              <td mat-cell *matCellDef="let app"> {{app.duration}} </td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef> Actions </th>
              <td mat-cell *matCellDef="let app">
                <button mat-stroked-button color="primary" [routerLink]="['/applications', app.id]">View Details</button>
                <button *ngIf="app.status === 'Pending'" mat-stroked-button color="warn" (click)="cancelApplication(app.id)">Cancel</button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</main>
