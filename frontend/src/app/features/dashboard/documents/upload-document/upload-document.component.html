<div class="modal-backdrop" (click)="closeUploadModal()"></div>
<div class="modal-container">
    <div class="dialog-content mat-elevation-z4">
        <div class="dialog-header">
            <h2 class="dialog-title">Upload Document</h2>
            <button mat-icon-button (click)="closeUploadModal()" aria-label="Close dialog">
                <mat-icon>close</mat-icon>
            </button>
        </div>

        <mat-divider></mat-divider>
        
        <div class="dialog-body">
            <form [formGroup]="uploadForm">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Document Type</mat-label>
                    <mat-select formControlName="documentType">
                        <mat-option [value]="">Select document type</mat-option>
                        <mat-option *ngFor="let type of documentTypes" [value]="type.value">
                            {{type.viewValue}}
                        </mat-option>
                    </mat-select>
                    <mat-error *ngIf="uploadForm.get('documentType')?.hasError('required')">
                        Please select a document type
                    </mat-error>
                </mat-form-field>
                
                <div class="file-upload-container">
                    <div class="file-input-wrapper">
                        <input
                            type="file"
                            id="file"
                            #fileInput
                            (change)="onFileSelected($event)"
                            accept=".pdf,.jpg,.jpeg,.png"
                            class="file-input"
                        >
                        <button mat-stroked-button type="button" class="file-select-button" (click)="fileInput.click()">
                            <mat-icon>attach_file</mat-icon>
                            Select File
                        </button>
                        <span class="file-name" *ngIf="selectedFile">{{selectedFile.name}}</span>
                        <span class="file-name" *ngIf="!selectedFile">No file selected</span>
                    </div>
                    <p class="file-help-text">Maximum file size: 5MB. Accepted formats: PDF, JPG, PNG</p>
                    <p class="file-error" *ngIf="uploadError">{{uploadError}}</p>
                </div>
            </form>
        </div>

        <mat-divider></mat-divider>
        
        <div class="dialog-footer">
            <button mat-button (click)="closeUploadModal()">Cancel</button>
            <button
                mat-raised-button
                color="primary"
                (click)="uploadDocument()"
                [disabled]="!uploadForm.valid || !selectedFile || isUploading"
            >
                <mat-spinner *ngIf="isUploading" diameter="20" class="spinner"></mat-spinner>
                <span>{{isUploading ? 'Uploading...' : 'Upload'}}</span>
            </button>
        </div>
    </div>
</div>
