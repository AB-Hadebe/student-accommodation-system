<div class="modal-backdrop" (click)="onClose()"></div>
<div class="modal-container">
    <div class="dialog-content mat-elevation-z4">
        <div class="dialog-header">
            <h2 class="dialog-title">Document Details</h2>
            <button mat-icon-button (click)="onClose()" aria-label="Close dialog">
                <mat-icon>close</mat-icon>
            </button>
        </div>

        <mat-divider></mat-divider>

        <div class="dialog-body">
            <!-- Document Info -->
            <div class="document-info">
                <div class="info-grid">
                    <div class="info-item">
                        <p class="info-label">Document Name</p>
                        <p class="info-value">{{document.name}}</p>
                    </div>
                    <div class="info-item">
                        <p class="info-label">Status</p>
                        <mat-chip [ngClass]="getStatusClass(document.status)">
                            {{document.status}}
                        </mat-chip>
                    </div>
                    <div class="info-item">
                        <p class="info-label">Upload Date</p>
                        <p class="info-value">{{document.uploadDate | date}}</p>
                    </div>
                    <div class="info-item">
                        <p class="info-label">File Size</p>
                        <p class="info-value">{{document.size}}</p>
                    </div>
                </div>
            </div>

            <!-- Document Preview -->
            <div class="document-preview">
                <div class="preview-placeholder">
                    <mat-icon class="preview-icon">description</mat-icon>
                    <p class="preview-text">Document Preview</p>
                </div>
            </div>
        </div>

        <mat-divider></mat-divider>

        <div class="dialog-footer">
            <button mat-stroked-button (click)="onClose()">Close</button>
            <button mat-raised-button color="primary">
                <mat-icon>download</mat-icon>
                Download
            </button>
        </div>
    </div>
</div>
