<div class="upload-container">
  <mat-card class="upload-card">
    <mat-card-header class="upload-header">
      <mat-card-title class="upload-title">Document Upload</mat-card-title>
      <mat-card-subtitle class="upload-subtitle">
        Upload the required documents to complete your application
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="upload-content">
      <!-- Progress Bar -->
      <div class="progress-section">
        <mat-progress-bar mode="determinate" value="75"></mat-progress-bar>
        <p class="progress-text">Step 3 of 4</p>
      </div>

      <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()" class="upload-form">
        <div class="documents-section">
          <div *ngFor="let doc of requiredDocuments" class="document-card">
            <mat-card class="document-upload-card">
              <mat-card-content>
                <div class="document-header">
                  <div class="document-info">
                    <h3 class="document-title">{{ doc.name }}</h3>
                    <p class="document-description">{{ doc.description }}</p>
                  </div>
                  <div class="upload-status" *ngIf="uploadedFiles[doc.id]">
                    <mat-icon class="success-icon">check_circle</mat-icon>
                    <mat-chip class="status-chip">Uploaded</mat-chip>
                  </div>
                </div>

                <div class="upload-area">
                  <div class="file-input-container">
                    <input
                      type="file"
                      [id]="'file-' + doc.id"
                      class="file-input"
                      (change)="onFileSelected($event, doc.id.toString())"
                      accept=".pdf,.jpg,.jpeg,.png"
                      [class.error]="uploadForm.get(doc.id.toString())?.invalid && uploadForm.get(doc.id.toString())?.touched"
                    />
                    <label [for]="'file-' + doc.id" class="file-input-label">
                      <mat-icon>cloud_upload</mat-icon>
                      <span class="upload-text">
                        {{ uploadedFiles[doc.id] ? uploadedFiles[doc.id].name : 'Choose file or drag and drop' }}
                      </span>
                    </label>
                  </div>
                  
                  <div 
                    class="error-message" 
                    *ngIf="uploadForm.get(doc.id.toString())?.invalid && uploadForm.get(doc.id.toString())?.touched">
                    <mat-icon>error</mat-icon>
                    Please upload {{ doc.name }}
                  </div>
                </div>

                <div class="file-requirements">
                  <mat-icon class="info-icon">info</mat-icon>
                  <span>Accepted formats: PDF, JPG, PNG (Max size: 5MB)</span>
                </div>
              </mat-card-content>
            </mat-card>
          </div>
        </div>
      </form>
    </mat-card-content>    <mat-card-actions class="upload-actions">
      <button
        mat-raised-button
        color="primary"
        class="continue-button"
        type="submit"
        (click)="onSubmit()"
        [disabled]="isSubmitting || uploadForm.invalid">
        <mat-spinner *ngIf="isSubmitting" diameter="20" class="button-spinner"></mat-spinner>
        <mat-icon *ngIf="!isSubmitting">arrow_forward</mat-icon>
        {{ isSubmitting ? 'Uploading...' : 'Continue to Review' }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
