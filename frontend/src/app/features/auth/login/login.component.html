<div class="login-container">
  <mat-card class="login-card">
    <mat-card-content>
      <!-- Apple-inspired Header Section -->
      <div class="setup-header">
        <h1 class="welcome-title">Welcome Back</h1>
        <p class="welcome-subtitle">Sign in to your Student Housing account</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <!-- Email Field -->
        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Email Address</mat-label>
          <input matInput type="email" formControlName="email" placeholder="Enter your email" autocomplete="email">
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
            Email is required
          </mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
            Please enter a valid email address
          </mat-error>
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
            placeholder="Enter your password" autocomplete="current-password">
          <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()"
            [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Password is required
          </mat-error>
          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
            Password must be at least 8 characters long
          </mat-error>
        </mat-form-field>

        <!-- Submit Button -->
        <button mat-raised-button color="primary" type="submit" class="login-button"
          [disabled]="isSubmitting || loginForm.invalid">
          <mat-spinner *ngIf="isSubmitting" diameter="20" class="button-spinner"></mat-spinner>
          <span *ngIf="!isSubmitting">Sign In</span>
          <span *ngIf="isSubmitting">Signing in...</span>
        </button>

        <!-- Divider -->
        <div class="login-divider">
          <span>or</span>
        </div>

        <!-- Sign Up Link -->
        <button mat-button color="accent" routerLink="/signup" class="signup-button" type="button">
          <mat-icon>person_add</mat-icon>
          Sign up
        </button>

        <!-- Forgot Password Link -->
        <div class="forgot-password">
          <a mat-button routerLink="/forgot-password" class="forgot-link">
            Forgot your password?
          </a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
