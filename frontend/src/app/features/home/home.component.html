<div class="home-container">
  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-content">
      <h1 class="hero-title">Find Your Perfect Student Accommodation</h1>
      <p class="hero-subtitle">Simple, secure, and hassle-free student housing management platform</p>
      <div class="hero-actions">
        <button mat-raised-button color="primary" routerLink="/signup" class="hero-button primary-button">
          <mat-icon>person_add</mat-icon>
          Register Now
        </button>
        <button mat-outlined-button routerLink="/login" class="hero-button secondary-button">
          <mat-icon>login</mat-icon>
          Sign In
        </button>
      </div>
    </div>
  </section>

  <!-- Features Section -->
  <section class="features-section">
    <div class="features-grid">
      <mat-card class="feature-card" *ngFor="let feature of features">
        <mat-card-content class="feature-content">
          <div class="feature-icon-container">
            <mat-icon class="feature-icon">{{feature.icon}}</mat-icon>
          </div>
          <mat-card-title class="feature-title">{{feature.title}}</mat-card-title>
          <mat-card-subtitle class="feature-description">{{feature.description}}</mat-card-subtitle>
        </mat-card-content>
      </mat-card>
    </div>
  </section>
</div>
