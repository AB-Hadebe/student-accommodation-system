plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.sonarqube" version "6.2.0.5505"
}

group = 'com.beezhub'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	implementation 'io.minio:minio:8.5.17'
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat = "full"
	}
}

jacoco {
	toolVersion = "0.8.12"
	reportsDirectory = file("${buildDir}/jacocoHtml")
}

jacocoTestReport {
	reports {
	csv.required = true
	xml.required = true
		html.required = true
	}
	dependsOn test
}

jacocoTestCoverageVerification {
	dependsOn(jacocoTestReport)
	enabled = true
	violationRules {
		rule {
			element = "CLASS"
	    includes = [
		    "com.beezhub.student_accommodation.service.*",
		    "com.beezhub.student_accommodation.controller.*",
		    "com.beezhub.student_accommodation.mapper.*",
		    "com.beezhub.student_accommodation.security.*"
	    ]
			limit {
				counter = "LINE"
				value = "COVEREDRATIO"
				minimum = 0.00
			}
		}
	}
}

sonarqube {
    properties {
        property ("sonar.host.url", "http://localhost:9002")
        property ("sonar.projectKey", "student-accommodation-system")
        property ("sonar.projectName", "student-accommodation-system")
        // Point SonarQube to the actual Jacoco XML report path (custom reportsDirectory used above)
        property ("sonar.coverage.jacoco.xmlReportPaths", file("${buildDir}/jacocoHtml/test/jacocoTestReport.xml").path)
    }
}

check.dependsOn jacocoTestCoverageVerification

// Task to download dependencies
task downloadDependencies() {
    doLast {
        configurations.all { configuration ->
            if (configuration.canBeResolved) {
                configuration.resolve()
            }
        }
    }
}
